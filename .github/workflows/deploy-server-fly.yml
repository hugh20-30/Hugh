name: Deploy server to Fly.io

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.FLY_API_TOKEN && secrets.FLY_APP_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          sudo ln -s $HOME/.fly/bin/flyctl /usr/local/bin/flyctl || true

      - name: Deploy with flyctl
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
        run: |
          echo "Logging into Fly.io..."
          flyctl auth token "$FLY_API_TOKEN"
          echo "Deploying app $FLY_APP_NAME using image from GHCR"
          # Deploy using image in GHCR published by publish-server-image.yml
          flyctl deploy --app "$FLY_APP_NAME" --image ghcr.io/${{ github.repository_owner }}/hugh-ws-server:latest --remote-only
