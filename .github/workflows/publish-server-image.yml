name: Publish websocket server image to GHCR

on:
  push:
    paths:
      - 'server/**'
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hugh-ws-server:latest
            ghcr.io/${{ github.repository_owner }}/hugh-ws-server:${{ github.sha }}

      - name: Output image
        run: echo "Published ghcr.io/${{ github.repository_owner }}/hugh-ws-server"
